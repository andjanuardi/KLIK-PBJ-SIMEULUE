<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>KLIK-PBJ Simeulue</title>
    <script>
      // SPA fallback untuk GitHub Pages project site.
      // Simpan path di dalam repo lalu kembalikan ke index.
      (function () {
        var repo = "/KLIK-PBJ-SIMEULUE";
        var path = window.location.pathname.slice(repo.length) || "/";
        var dest = path + window.location.search + window.location.hash;
        try {
          sessionStorage.setItem("gh-pages-redirect", dest);
        } catch (e) {}
        window.location.replace(repo + "/");
      })();
    </script>
  </head>
  <body></body>
</html>
